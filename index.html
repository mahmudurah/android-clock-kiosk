<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Wall Clock</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      -webkit-font-smoothing: antialiased;
      user-select: none;
      -webkit-user-select: none;
    }

    /* 1. Pure OLED Dark */
    body.theme-oled { background-color: #050608; color: #c8cfd8; }
    body.theme-oled .muted { color: #6b7685; }
    body.theme-oled .divider { background-color: #1b2028; }

    /* 2. Crisp Daylight */
    body.theme-daylight { background-color: #f4f5f7; color: #111418; }
    body.theme-daylight .muted { color: #525c68; }
    body.theme-daylight .divider { background-color: #d8dde3; }

    /* 3. Warm Paper */
    body.theme-paper { background-color: #f5efe4; color: #2b2620; }
    body.theme-paper .muted { color: #756a5c; }
    body.theme-paper .divider { background-color: #dfd5c5; }

    /* 4. E-Ink Monochrome */
    body.theme-eink { background-color: #e6e6e2; color: #141414; font-family: "Courier New", Courier, monospace; }
    body.theme-eink .muted { color: #555552; }
    body.theme-eink .divider { background-color: #b8b8b2; }

    /* 5. Retro Amber */
    body.theme-amber { background-color: #080500; color: #ff9d2e; }
    body.theme-amber .muted { color: #9c5b14; }
    body.theme-amber .divider { background-color: #2e1b06; }

    /* 6. Terminal Green */
    body.theme-terminal { background-color: #030a04; color: #4dff73; font-family: "Courier New", Courier, monospace; }
    body.theme-terminal .muted { color: #228738; }
    body.theme-terminal .divider { background-color: #0f3818; }

    /* 7. Bedroom Red (low night glare) */
    body.theme-red-night { background-color: #000000; color: #b82525; }
    body.theme-red-night .muted { color: #661414; }
    body.theme-red-night .divider { background-color: #240707; }

    /* 8. Nord Slate */
    body.theme-nord { background-color: #2e3440; color: #eceff4; }
    body.theme-nord .muted { color: #88c0d0; }
    body.theme-nord .divider { background-color: #434c5e; }

    /* 9. Espresso */
    body.theme-espresso { background-color: #17120e; color: #eadbc8; }
    body.theme-espresso .muted { color: #9a8570; }
    body.theme-espresso .divider { background-color: #30251c; }

    /* 10. Midnight Blue */
    body.theme-midnight-blue { background-color: #081226; color: #d6e4ff; }
    body.theme-midnight-blue .muted { color: #6c8ec4; }
    body.theme-midnight-blue .divider { background-color: #162a52; }

    .wrap {
      width: 100%;
      height: 100%;
      display: -webkit-box;
      display: -webkit-flex;
      display: flex;
      -webkit-box-orient: vertical;
      -webkit-box-direction: normal;
      -webkit-flex-direction: column;
      flex-direction: column;
      -webkit-box-pack: center;
      -webkit-justify-content: center;
      justify-content: center;
      -webkit-box-align: center;
      -webkit-align-items: center;
      align-items: center;
      padding: 4vh 5vw;
      text-align: center;
    }

    .time-row {
      display: -webkit-box;
      display: -webkit-flex;
      display: flex;
      -webkit-box-align: baseline;
      -webkit-align-items: baseline;
      align-items: baseline;
      -webkit-box-pack: center;
      -webkit-justify-content: center;
      justify-content: center;
      line-height: 0.95;
    }

    #time {
      font-size: 25vw;
      font-weight: 700;
      letter-spacing: -0.03em;
      font-variant-numeric: tabular-nums;
    }

    #ampm {
      font-size: 5.5vw;
      font-weight: 600;
      margin-left: 1.5vw;
      text-transform: uppercase;
    }

    #date {
      margin-top: 2.5vh;
      font-size: 6.5vw;
      font-weight: 500;
      letter-spacing: -0.01em;
    }

    .divider {
      width: 45vw;
      height: 2px;
      margin: 4vh 0;
    }

    .weather {
      display: -webkit-box;
      display: -webkit-flex;
      display: flex;
      -webkit-box-align: center;
      -webkit-align-items: center;
      align-items: center;
      -webkit-box-pack: center;
      -webkit-justify-content: center;
      justify-content: center;
      gap: 3vw;
      font-size: 4.8vw;
      font-weight: 500;
    }

    #weather-temp {
      font-size: 6.5vw;
      font-weight: 700;
      font-variant-numeric: tabular-nums;
    }

    #weather-hi-lo {
      font-variant-numeric: tabular-nums;
    }

    #theme-btn {
      position: fixed;
      bottom: 2vh;
      right: 2vw;
      background: transparent;
      border: none;
      color: inherit;
      opacity: 0.25;
      font-size: 2.4vh;
      padding: 1vh 1.5vw;
      cursor: pointer;
    }

    #toast {
      position: fixed;
      bottom: 3vh;
      left: 50%;
      -webkit-transform: translateX(-50%);
      transform: translateX(-50%);
      background: rgba(128, 128, 128, 0.25);
      color: inherit;
      padding: 0.8vh 2.5vw;
      border-radius: 999px;
      font-size: 2.4vh;
      opacity: 0;
      pointer-events: none;
    }

    @media (orientation: portrait) {
      #time { font-size: 26vw; }
      #ampm { font-size: 6vw; }
      #date { font-size: 7vw; }
      .weather { font-size: 5vw; }
      #weather-temp { font-size: 7vw; }
    }
  </style>
</head>
<body class="theme-oled">
  <div class="wrap" id="stage">
    <div class="time-row">
      <span id="time">--:--</span>
      <span id="ampm" class="muted"></span>
    </div>
    <div id="date" class="muted">---</div>
    <div class="divider"></div>
    <div class="weather">
      <span id="weather-temp">--&deg;</span>
      <span id="weather-cond" class="muted">Loading...</span>
      <span id="weather-hi-lo" class="muted"></span>
    </div>
  </div>
  <div id="toast"></div>
  <button id="theme-btn" type="button" aria-label="Cycle theme">&#9680;</button>
  <script src="app.js"></script>
</body>
</html>
